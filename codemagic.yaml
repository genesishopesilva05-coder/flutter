
workflows:
  ios-sideloadly:
    name: Flutter iOS IPA for Sideloadly

    max_build_duration: 120

    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Sideloadly.ipa Payload

    artifacts:
      - Sideloadly.ipa
      - build/ios/iphoneos/Runner.app
